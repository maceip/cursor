syntax = "proto3";

package com.cursor.engine.v1;

option java_multiple_files = true;
option java_package = "com.cursor.engine.v1";

service AgentOrchestrator {
  rpc StreamFabric(stream MobileUpstreamSignal) returns (stream FabricDownstreamPacket);
}

message MobileUpstreamSignal {
  string signal_id = 1;
  int64 timestamp_ms = 2;

  oneof payload {
    ActionApproval approval = 3;
    UserMessage text_input = 4;
    CancelTask cancel = 5;
  }
}

message FabricDownstreamPacket {
  string packet_id = 1;
  uint64 sequence_number = 2;
  int64 timestamp_ms = 3;

  string host_id = 4;
  string workspace_id = 5;
  string agent_run_id = 6;

  oneof payload {
    AgentStatus status = 7;
    TokenChunk token_chunk = 8;
    DiffDelta diff_delta = 9;
  }
}

message AgentStatus {
  enum State {
    IDLE = 0;
    THINKING = 1;
    EXECUTING_TOOL = 2;
    AWAITING_APPROVAL = 3;
  }

  State state = 1;
  string active_tool = 2;
}

message TokenChunk {
  string text_delta = 1;
}

message DiffDelta {
  string file_path = 1;
  int32 line_start = 2;
  repeated string hunks = 3;
}

message ActionApproval {
  string interaction_id = 1;
  bool approved = 2;
  string message_override = 3;
}

message UserMessage {
  string text = 1;
}

message CancelTask {
  string agent_run_id = 1;
}
