name: Debug APK Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: debug-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="debug-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          apk="dist/cursor-debug-${tag}.apk"

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          {
            echo "tag=$tag"
            echo "apk=$apk"
            echo "title=Cursor Debug APK ${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Debug APK built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. This build is signed with the debug key and intended for testing." \
            --prerelease
